[build-system]
requires = [
    "setuptools>=61",
    "wheel",
    "setuptools-git-versioning>=3.0,<4",
]
build-backend = "setuptools.build_meta"

[project]
name = "pyuvm"
description = "A Python implementation of the UVM using cocotb"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Ray Salemi", email = "ray@raysalemi.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Framework :: cocotb",
]
dependencies = [
    "cocotb>=1.6.0,<3.0",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/pyuvm/pyuvm"
"Bug Tracker" = "https://github.com/pyuvm/pyuvm/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyuvm*"]

[dependency-groups]
dev = [
    "pre-commit",
    "ruff",
    {include-group = "tests"},
]
tests = [
    "pytest",
    "coverage",
]
docs = [
    "cocotb>=2.0.1",
    "myst-parser>=4.0.1",
    "sphinx>=8.2.3",
    "sphinx-autodoc2>=0.5.0",
    "sphinx-rtd-theme>=3.0.2",
]

[tool.uv.dependency-groups]
docs = {requires-python = ">=3.11"}

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = [
    "I",        # isort
    "UP",       # pyupgrade
    "PL",       # pylint
    "E",        # pycodestyle errors
    "W",        # pycodestyle warnings
    "F",        # pyflakes
    "C4",       # flake8-comprehension
    "LOG",      # flake8-logging
    "G",        # flake8-logging-format
    "ISC",      # implicit string concat
    "TC",       # flake8-typechecking
    "PTH",      # flake8-use-pathlib
    "B",        # flake8-bugbear
    "BLE",      # flake8-blind-except
    "T10",      # flake8-debugger
    "EXE",      # flake8-executable
    "DTZ",      # flake8-datetimez
    "YTT",      # flake8-2020
    "SLOT",     # flake8-slots
    "PERF",     # perflint
    "SIM103",   # return the condition directly
    "SIM300",   # yoda conditions
    "RUF100",   # unused noqa
    "RUF101",   # redirected noqa
    "RUF010",   # explicit type conversion in f-string
    "RUF005",   # collection literal concatenation
    "RUF022",   # unsorted __all__
    "RUF023",   # unsorted __slots__
    "PYI030",   # unnecessary literal union
    "PT010",    # pytest.raises without an Exception type argument
    "PT031",    # pytest.warns should be single statement
    "TRY201",   # `raise exc` instead of plain `raise`
    "TRY401",   # logging with exception instead of `log.exception`
    "S102",     # use of `exec`
    "S110",     # try-except-pass
    "S112",     # try-except-continue
]
ignore = [
    "E741",    # ambiguous variable name (preference)
    "E501",    # line too long (preference)
    "F405",    # Undefined local with import star usage (preference)
    "F403",    # Undefined local with import star (preference)
    "PLR0912", # Too many branches (>12) (preference)
    "PLR0913", # Too many arguments to function call (>5) (preference)
    "PLR0915", # Too many statements (>50) (preference)
    "PLR0917", # Too many positional args (>5) (preference)
    "PLR2004", # Magic value used in comparison (preference)
    "PLR0911", # Too many return statements (preference)
    "PLW0603", # Using the global statement (pedantic)
    "PLW1641", # __eq__ without __hash__ (mypy compatibility)
    "PTH123",  # Path.open() over open() (preference)
    "PTH207",  # Path.glob() over glob.glob() (preference)
    "LOG004",  # Use of log.exception outside exception handler (bad assumption)
    "B010",    # Do not call `setattr` with constant value (mypy compatibility)
    "B011",    # Do not `assert False` (pytest/cocotb test compatibility)
    "PERF203", # try-except in loop (not an issue Python > 3.11)
]

[tool.ruff.lint.isort]
known-first-party = [
    "pyuvm",
]
known-third-party = [
    "pytest",
    "cocotb",
]

[tool.ruff.lint.per-file-ignores]
"pyuvm/__init__.py" = [
    "F401",
    "I001",
]
"pyuvm/uvm_reporting/__init__.py" = [
    "E402",
    "I001",
]

[tool.codespell]
skip = 'uv.lock'
ignore-words-list = [
    "synopsys",
]

[tool.pytest.ini_options]
testpaths = [
    "tests/pytests",
]
# Make the repo top importable from any test (issue #406), so a test can
# pull code from any other test or example, e.g.
# `from examples.TinyALU.testbench import ...`.
pythonpath = ["."]
markers = [
    "test_reg_get_name",
    "test_reg_configure",
    "test_reg_with_single_field",
    "test_reg_with_multiple_fields",
    "test_reg_with_multiple_felds_reset",
    "test_reg_with_multiple_fields_get_mirrored_value",
    "test_reg_with_multiple_fields_get_desired_value",
    "reg_block_get_field_single_reg",
    "reg_block_get_field_multiple_regs",
    "reg_block_get_field_sub_reg_block",
    "reg_block_get_reg_by_name",
    "reg_block_get_field_by_name",
    "test_reg_simple_predict",
    "test_reg_predict_edge_cases",
    "test_reg_predict_with_reserved_spaces",
    "test_reg_field_get_name",
    "test_reg_field_configure",
    "test_reg_field_is_volatile",
    "test_reg_field_all_access",
    "test_reg_field_lsb_pos",
    "test_reg_field_reset",
    "test_reg_field_get",
    "test_reg_field_get_value",
    "test_reg_field_field_predict_read_set",
    "test_reg_field_field_predict_read_clear",
    "test_reg_field_field_predict_write_set",
    "test_reg_field_field_predict_write_clear",
    "test_reg_field_field_predict_TOGGLE",
    "test_reg_field_field_predict_NO_ACCESS",
    "test_reg_field_field_predict_status_error_on_write",
    "test_reg_field_field_predict_status_error_on_read",
    "test_reg_block_get_name",
    "test_reg_block_with_single_reg",
    "test_reg_block_with_multiple_regs",
    "test_reg_map_get_name",
    "test_reg_map_configure",
    "test_reg_map_with_single_reg",
    "test_reg_map_with_multiple_regs",
    "reg_block_get_name",
    "reg_block_with_single_reg",
    "reg_block_with_multiple_regs",
    "reg_block_with_sub_blocks",
    "reg_block_get_field_empty_reg",
]

[tool.setuptools-git-versioning]
enabled = true
version_file = "VERSION"
count_commits_from_version_file = true
dev_template = "{tag}.dev{ccount}+r{sha}"
dirty_template = "{tag}.dev{ccount}+r{sha}.dirty"
